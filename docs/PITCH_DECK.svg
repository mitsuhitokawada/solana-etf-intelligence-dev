<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4860" viewBox="0 0 1440 4860"><g transform="translate(0 0)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 1 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">Solana ETF Intelligence</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">Connect ETF demand with SOL market activity.</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Live prices, US ETF flows and Solana onchain activity.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">A public dashboard plus conversational data access.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Built with ChatGPT Sites, Plugin Extensions and MCP.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">Live-data development version | 10 October 2026</text></g><g transform="translate(0 810)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 2 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">The question analysts need to answer</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">Do ETF flows move together with SOL returns?</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">ETF flows and crypto prices live in separate dashboards.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Onchain trading volume adds context to market activity.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Analysts need aligned dates, traceable sources and clear limits.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">For research teams, market analysts and Solana investors</text></g><g transform="translate(0 1620)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 3 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">One view across four live sources</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">From institutional flows to network activity.</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">CoinGecko: SOL price and 7 / 30 / 90-day price charts.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">SoSoValue: US Solana ETF net flows and net assets.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">DefiLlama: Solana DEX volume over 24h / 7d / 30d.</text><circle cx="82" cy="610" r="5" fill="#55e6bc"/><text x="106" y="620" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">PublicNode: direct Solana mainnet performance samples.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">DEX volume covers tracked Solana DEX tokens; it is not net inflow.</text></g><g transform="translate(0 2430)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 4 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">The core value: an explicit comparison</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">Match ETF trading dates with daily SOL returns.</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Pair ETF flow on date D with D-to-D+1 UTC price change.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Compute Pearson correlation with at least 10 matched dates.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Show the actual comparison period and sample size.</text><circle cx="82" cy="610" r="5" fill="#55e6bc"/><text x="106" y="620" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Summarize market movements using reproducible numeric rules.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">Correlation is descriptive. UTC windows differ from US trading sessions.</text></g><g transform="translate(0 3240)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 5 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">Built for dashboards and conversation</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">ChatGPT Sites x Plugin Extensions x hosted MCP.</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Browser: Sites server retrieves data for the public dashboard.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">ChatGPT: authenticated MCP tools retrieve the same snapshot.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Plugin Extension presents the data inside ChatGPT.</text><circle cx="82" cy="610" r="5" fill="#55e6bc"/><text x="106" y="620" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Source timestamps, definitions and errors remain visible.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">MCP retrieval verified. Extension question sending has a known composer error.</text></g><g transform="translate(0 4050)"><rect width="1440" height="810" fill="#0c1824"/><rect x="72" y="68" width="70" height="7" fill="#55e6bc"/><text x="72" y="140" font-family="Arial,sans-serif" font-size="26" fill="#55e6bc">SOLANA ETF INTELLIGENCE · 6 / 6</text><text x="72" y="235" font-family="Arial,sans-serif" font-size="49" font-weight="bold" fill="#ffffff">Demo, status and next steps</text><text x="72" y="310" font-family="Arial,sans-serif" font-size="32" fill="#a6b9cc">A working live-data research prototype.</text><circle cx="82" cy="400" r="5" fill="#55e6bc"/><text x="106" y="410" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Public English demo and development source are available.</text><circle cx="82" cy="470" r="5" fill="#55e6bc"/><text x="106" y="480" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Original Colosseum simulated-data demo remains separate.</text><circle cx="82" cy="540" r="5" fill="#55e6bc"/><text x="106" y="550" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Next: longer aligned history, lag comparisons and stronger UX.</text><circle cx="82" cy="610" r="5" fill="#55e6bc"/><text x="106" y="620" font-family="Arial,sans-serif" font-size="28" fill="#e6edf3">Potential research subscription / MCP service; demand unvalidated.</text><text x="72" y="748" font-family="Arial,sans-serif" font-size="22" fill="#93a6bb">Read-only RPC integration; no deployed onchain program or trade execution.</text></g></svg>